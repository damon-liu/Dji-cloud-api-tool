[package]
name = "dji-cloud-api-tool-next"
version = "0.1.0"
description = "DJI Cloud API Tool Next"
authors = ["DJI Cloud API Tool Contributors"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "dji_cloud_api_tool_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dji-cloud-api-tool-next"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
rumqttc = "0.24"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
dirs = "5"
